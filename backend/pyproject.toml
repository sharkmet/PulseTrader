[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsetrader-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "ta>=0.11",
    "vaderSentiment>=3.3",
    "google-genai>=1.0",         # Gemini (free tier) — new SDK
    "anthropic>=0.28",           # optional Claude fallback
    "httpx>=0.27",
    "apscheduler>=3.10",
    "python-dotenv>=1.0",
    "feedparser>=6.0",       # RSS news aggregation
    "loguru>=0.7",           # structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.4",
    "types-requests>=2.31",
]
finbert = [
    "transformers>=4.40",
    "torch>=2.2",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
pulse = "backend.cli:main"
pulse-mcp = "backend.mcp_server:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
addopts = "-v --tb=short"

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "E701",  # single-line if/return — valid for short guard clauses
    "E702",  # multiple statements via semicolon — valid for compact append pairs
    "B008",  # FastAPI Depends() calls in defaults
    "SIM117", # nested with is fine for DB patterns
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = false          # move to strict incrementally
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
